name: Mise à jour du calendrier
on:
  schedule:
    - cron: "0 4 * * *"   # chaque nuit
  workflow_dispatch:       # bouton "Run workflow"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scraper.py
      - name: Enregistrer le fichier
        run: |
          git config user.name "calendrier-bot"
          git config user.email "bot@users.noreply.github.com"
          git add *.ics
          git diff --cached --quiet || git commit -m "Mise à jour des conférences"
          git push
